name: Publish to npm

on:
  workflow_dispatch:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Use a trusted-publishing compatible npm
        run: npm install --global npm@11
      - name: Verify release ref and package version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            if [ "$GITHUB_REF" != "refs/tags/v$version" ]; then
              echo "Release ref $GITHUB_REF does not match package version $version"
              exit 1
            fi
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "Manual publishing is only permitted from main, not $GITHUB_REF"
              exit 1
            fi
          else
            echo "Unexpected release trigger: $GITHUB_EVENT_NAME"
            exit 1
          fi
      - run: npm test
      - run: npm run check
      - run: npm pack --dry-run
      - name: Publish
        run: npm publish --access public
